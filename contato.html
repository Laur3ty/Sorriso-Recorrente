<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="header">
        <img class="img.logo" src="./img/logo-tdb.png" alt="Logo do Sorriso Recorrente"  width="94" height="70">
        <nav class="menu">
            <a class="btn" href="index.html">Sorriso Recorrente</a>
            <a class="btn" href="sobre.html">Sobre o projeto</a>
            <a class="btn" href="doador.html">Portal do doador</a>
            <a class="btn" href="resultado.html">Resultado da doação</a>
            <a class="btn" href="equipe.html">Portal da equipe</a>
            <a class="btn" href="faq.html">FAQ</a>
            <a class="btn" href="contato.html">Contato</a>
            <a class="btn" href="integrantes.html">Integrantes</a>
        </nav>
    </header>
    <main class="main">
        <section class="section.hero">
            <div class="container.hero">
                <p>Contato</p>
                <h1>Fale com o grupo</h1>
            </div>
        </section>
        <section class="section.formulario">
            <form class="formulario" action="contato.html" method="get">
                <h2>Envie uma mensagem</h2>
                    <div class="form">
                        <label for="name">Nome</label>
                        <input required type="text" id="name" name="name" placeholder="Digite seu nome">
                    </div>
                    <div class="form">
                        <label for="email" class="label">Email</label>
                        <input inputmode="email" required type="email" id="email" name="email" placeholder="Digite seu email"> <!-- Required - Declara que é obrigatório -->
                    </div>
                    <div class="form">
                        <label for="assunto">Assunto</label>
                        <select id="assunto" name="assunto">
                            <option value="">Escolha um assunto</option>
                            <option value="duvida">Dúvida sobre o projeto</option>
                            <option value="sugestao">Sugestão</option>
                            <option value="outro">Outro assunto</option>
                        </select>
                    </div>
                    <div class="form">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui"></textarea>
                    </div>
                <button class="botao" type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <section class="container.footer">
            <p>Sorriso Recorrente · Challenge FIAP × Turma do Bem · 1TDS</p>
        </section>
        <section class="container.footer">
            <p>Projeto acadêmico. Dados de doadores, voluntários e ajudados são fictícios.</p>
        </section>
    </footer>
</body>
</html>
